<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Testlesenden-Fragebogen – Der Exilant I</title>
  <style>
    :root {
      --bg:#111318; --card:#1b1f2a; --muted:#aeb6c6; --text:#f3f5f8; --line:#303746; --accent:#d6b35f; --danger:#ffb4a8;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:linear-gradient(140deg,#0f1117,#191d27); color:var(--text); line-height:1.45; }
    main { width:min(900px,92vw); margin:38px auto; }
    .card { background:rgba(27,31,42,.96); border:1px solid var(--line); border-radius:22px; padding:28px; box-shadow:0 24px 70px rgba(0,0,0,.32); }
    h1 { margin:0 0 8px; font-size:clamp(1.8rem,4vw,2.7rem); }
    h2 { margin:30px 0 12px; font-size:1.18rem; color:var(--accent); }
    p, .hint { color:var(--muted); }
    form { display:grid; gap:16px; }
    .field { display:grid; gap:7px; }
    label { font-weight:700; }
    label span { display:block; margin-top:2px; color:var(--muted); font-weight:500; font-size:.92rem; }
    input, select, textarea { width:100%; border:1px solid var(--line); border-radius:12px; background:#0f131b; color:var(--text); padding:12px 13px; font:inherit; }
    textarea { min-height:105px; resize:vertical; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .rating-field input { max-width:220px; }
    .submit-box { margin-top:18px; padding:16px; border:1px solid var(--line); border-radius:16px; background:#141925; }
    button { border:0; border-radius:14px; padding:14px 18px; background:var(--accent); color:#17120a; font-weight:800; cursor:pointer; font-size:1rem; }
    button:hover { filter:brightness(1.06); }
    .small { font-size:.92rem; color:var(--muted); }
    @media (max-width:720px) { .grid { grid-template-columns:1fr; } .card { padding:20px; } }
  </style>
</head>
<body>
<main>
  <section class="card">
    <h1>Testlesenden-Fragebogen</h1>

    <form id="feedbackForm">
      <div class="field">
        <label for="chapter">Kapitel hier eintragen</label>
        <select id="chapter" name="Kapitel" required>
          <option value="Prolog">Prolog</option>
<option value="1. Kapitel">1. Kapitel</option>
<option value="2. Kapitel">2. Kapitel</option>
<option value="3. Kapitel">3. Kapitel</option>
<option value="4. Kapitel">4. Kapitel</option>
<option value="5. Kapitel">5. Kapitel</option>
<option value="6. Kapitel">6. Kapitel</option>
<option value="7. Kapitel">7. Kapitel</option>
<option value="8. Kapitel">8. Kapitel</option>
<option value="9. Kapitel">9. Kapitel</option>
<option value="10. Kapitel">10. Kapitel</option>
<option value="11. Kapitel">11. Kapitel</option>
<option value="12. Kapitel">12. Kapitel</option>
<option value="13. Kapitel">13. Kapitel</option>
<option value="14. Kapitel">14. Kapitel</option>
<option value="15. Kapitel">15. Kapitel</option>
<option value="16. Kapitel">16. Kapitel</option>
<option value="17. Kapitel">17. Kapitel</option>
<option value="18. Kapitel">18. Kapitel</option>
<option value="19. Kapitel">19. Kapitel</option>
<option value="20. Kapitel">20. Kapitel</option>
<option value="21. Kapitel">21. Kapitel</option>
<option value="22. Kapitel">22. Kapitel</option>
<option value="23. Kapitel">23. Kapitel</option>
<option value="24. Kapitel">24. Kapitel</option>
<option value="25. Kapitel">25. Kapitel</option>
<option value="26. Kapitel">26. Kapitel</option>
<option value="27. Kapitel">27. Kapitel</option>
<option value="28. Kapitel">28. Kapitel</option>
<option value="29. Kapitel">29. Kapitel</option>
<option value="30. Kapitel">30. Kapitel</option>
<option value="31. Kapitel">31. Kapitel</option>
<option value="32. Kapitel">32. Kapitel</option>
<option value="33. Kapitel">33. Kapitel</option>
<option value="34. Kapitel">34. Kapitel</option>
<option value="35. Kapitel">35. Kapitel</option>
<option value="36. Kapitel">36. Kapitel</option>
<option value="37. Kapitel">37. Kapitel</option>
<option value="38. Kapitel">38. Kapitel</option>
        </select>
      </div>

      <div class="field">
        <label for="reader">1. Trage deinen Namen oder deine E-Mail-Adresse hier ein <span>Vorname reicht. Falls nichts angegeben wird, wird die Rückmeldung als „Anonym“ verschickt.</span></label>
        <input id="reader" name="Name oder E-Mail" autocomplete="name" placeholder="z. B. Lina oder lina@example.de" />
      </div>

      <datalist id="scale-list"><option value="" selected>Bitte wählen oder Zahl eintragen</option><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></datalist>

      <div class="grid">
        <div class="field rating-field">
  <label for="lesefreude">Wie gern hast du dieses Kapitel gelesen?<span>0–10 | 10 = sehr</span></label>
  <input list="scale-list" id="lesefreude" name="Wie gern hast du dieses Kapitel gelesen?" inputmode="decimal" placeholder="0–10" pattern="^(10|[0-9])(\.[0-9])?$" />
</div>
<div class="field rating-field">
  <label for="weiterlesen">Wie sehr wolltest du danach weiterlesen?<span>0–10 | 10 = sehr</span></label>
  <input list="scale-list" id="weiterlesen" name="Wie sehr wolltest du danach weiterlesen?" inputmode="decimal" placeholder="0–10" pattern="^(10|[0-9])(\.[0-9])?$" />
</div>
<div class="field rating-field">
  <label for="verstaendlichkeit">Wie verständlich war das Kapitel?<span>0–10 | 10 = sehr</span></label>
  <input list="scale-list" id="verstaendlichkeit" name="Wie verständlich war das Kapitel?" inputmode="decimal" placeholder="0–10" pattern="^(10|[0-9])(\.[0-9])?$" />
</div>
<div class="field rating-field">
  <label for="spannung">Wie spannend oder fesselnd fandest du dieses Kapitel?<span>0–10 | 10 = sehr</span></label>
  <input list="scale-list" id="spannung" name="Wie spannend oder fesselnd fandest du dieses Kapitel?" inputmode="decimal" placeholder="0–10" pattern="^(10|[0-9])(\.[0-9])?$" />
</div>
<div class="field rating-field">
  <label for="emotion">Wie stark hat dich das Kapitel emotional berührt?<span>0–10 | 10 = sehr</span></label>
  <input list="scale-list" id="emotion" name="Wie stark hat dich das Kapitel emotional berührt?" inputmode="decimal" placeholder="0–10" pattern="^(10|[0-9])(\.[0-9])?$" />
</div>
<div class="field rating-field">
  <label for="atmosphaere">Bildhaftigkeit / Atmosphäre: Wie gut konntest du dir das Geschehen vorstellen?<span>0–10 | 10 = sehr</span></label>
  <input list="scale-list" id="atmosphaere" name="Bildhaftigkeit / Atmosphäre: Wie gut konntest du dir das Geschehen vorstellen?" inputmode="decimal" placeholder="0–10" pattern="^(10|[0-9])(\.[0-9])?$" />
</div>
<div class="field rating-field">
  <label for="gezogen">Gab es Stellen, die sich gezogen haben?<span>0 = gar nicht / 10 = sehr stark</span></label>
  <input list="scale-list" id="gezogen" name="Gab es Stellen, die sich gezogen haben?" inputmode="decimal" placeholder="0–10" pattern="^(10|[0-9])(\.[0-9])?$" />
</div>
<div class="field rating-field">
  <label for="natuerlichkeit">Wie natürlich oder menschlich geschrieben wirkte das Kapitel auf dich?<span>0–10 | 10 = sehr</span></label>
  <input list="scale-list" id="natuerlichkeit" name="Wie natürlich oder menschlich geschrieben wirkte das Kapitel auf dich?" inputmode="decimal" placeholder="0–10" pattern="^(10|[0-9])(\.[0-9])?$" />
</div>
      </div>

      <div class="field">
        <label for="interesting">Welche Figur war in diesem Kapitel am interessantesten? <span>Ein Name reicht.</span></label>
        <input id="interesting" name="Interessanteste Figur" placeholder="z. B. Ascana" />
      </div>

      <h2>Optionaler Extra-Bereich</h2>
      <p class="hint">Bitte nur ausfüllen, wenn es gerade passt.</p>

      <div class="field">
        <label for="stoerung">(Extra) Gab es etwas, das dich gestört oder rausgerissen hat?</label>
        <textarea id="stoerung" name="Gestört oder rausgerissen"></textarea>
      </div>
      <div class="field">
        <label for="gesamtgefuehl">(Extra) Dein spontanes Gesamtgefühl in einem Satz:</label>
        <textarea id="gesamtgefuehl" name="Gesamtgefühl in einem Satz"></textarea>
      </div>
      <div class="field">
        <label for="gedanken">(Extra) Gab es Fragen oder weitere Gedanken zu diesem Kapitel?</label>
        <textarea id="gedanken" name="Fragen oder weitere Gedanken"></textarea>
      </div>

      <div class="submit-box">
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
<button type="submit">E-Mail-Entwurf öffnen</button>
<button type="button" onclick="copyFeedback()">In Zwischenablage kopieren</button>
</div>
        <p class="small">Nach dem Absenden öffnet sich dein Mailprogramm mit einem fertigen E-Mail-Entwurf. Du musst dort nur noch auf „Abschicken“ klicken. Eine Empfangsbestätigung kann verzögert eintreffen oder ganz ausbleiben.</p>
      </div>
    </form>
  </section>
</main>
<script>
  const recipient = "dario.exilant@gmail.com";
  const chapter = document.getElementById('chapter');
  const form = document.getElementById('feedbackForm');

  function valueOf(id) {
    const el = document.getElementById(id);
    return (el?.value || '').trim();
  }

  function buildBody() {
    const name = valueOf('reader') || 'Anonym';
    const selectedChapter = chapter.value;
    const lines = [
      'Testlesenden-Fragebogen – Der Exilant I',
      '',
      'Name / Kontakt: ' + name,
      'Kapitel: ' + selectedChapter,
      '',
      '1. Wie gern hast du dieses Kapitel gelesen? (0–10 | 10 = sehr)',
      valueOf('lesefreude'),
      '',
      '2. Wie sehr wolltest du danach weiterlesen? (0–10 | 10 = sehr)',
      valueOf('weiterlesen'),
      '',
      '3. Wie verständlich war das Kapitel? (0–10 | 10 = sehr)',
      valueOf('verstaendlichkeit'),
      '',
      '4. Wie spannend oder fesselnd fandest du dieses Kapitel? (0–10 | 10 = sehr)',
      valueOf('spannung'),
      '',
      '5. Wie stark hat dich das Kapitel emotional berührt? (0–10 | 10 = sehr)',
      valueOf('emotion'),
      '',
      '6. Bildhaftigkeit / Atmosphäre: Wie gut konntest du dir das Geschehen vorstellen? (0–10 | 10 = sehr)',
      valueOf('atmosphaere'),
      '',
      '7. Gab es Stellen, die sich gezogen haben? (0 = gar nicht / 10 = sehr stark)',
      valueOf('gezogen'),
      '',
      '8. Welche Figur war in diesem Kapitel am interessantesten?',
      valueOf('interesting'),
      '',
      '9. Wie natürlich oder menschlich geschrieben wirkte das Kapitel auf dich? (0–10 | 10 = sehr)',
      valueOf('natuerlichkeit'),
      '',
      'Optionaler Extra-Bereich',
      '',
      '(Extra) Gab es etwas, das dich gestört oder rausgerissen hat?',
      valueOf('stoerung'),
      '',
      '(Extra) Dein spontanes Gesamtgefühl in einem Satz:',
      valueOf('gesamtgefuehl'),
      '',
      '(Extra) Gab es Fragen oder weitere Gedanken zu diesem Kapitel?',
      valueOf('gedanken'),
      '',
      'Hinweis: Empfangsbestätigung kann verzögert eintreffen oder ausbleiben.'
    ];
    return lines.join('\n');
  }

  
function copyFeedback() {
  navigator.clipboard.writeText(buildBody())
    .then(() => alert('Feedback wurde in die Zwischenablage kopiert.'))
    .catch(() => alert('Kopieren fehlgeschlagen.'));
}


form.addEventListener('submit', function(event) {
    event.preventDefault();
    const name = valueOf('reader') || 'Anonym';
    const subject = 'Feedback Der Exilant I – ' + chapter.value + ' – ' + name;
    const mailto = 'mailto:' + encodeURIComponent(recipient) +
      '?subject=' + encodeURIComponent(subject) +
      '&body=' + encodeURIComponent(buildBody());
    window.location.href = mailto;
  });
</script>
</body>
</html>
